<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title>KUQUBA logo sobre fondo azul</title>
<desc>Logo KUQUBA con isotipo geométrico, wordmark y lema Conexiones que generan confianza.</desc>

<rect width="1200" height="900" fill="#0D2233"/>

<!-- Isotipo -->
<g transform="translate(390 115)">
  <!-- Techo / propiedad -->
  <path d="M70 185 V115 L210 15 L350 115 V185"
        fill="none" stroke="#148575" stroke-width="22"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- pequeño acento terracota -->
  <path d="M350 151 V185" fill="none" stroke="#C46A3A" stroke-width="22"/>

  <!-- conexión interior -->
  <path d="M135 190 L210 115 L285 190"
        fill="none" stroke="#FFFFFF" stroke-width="24"
        stroke-linejoin="miter"/>

  <!-- diamante -->
  <rect x="184" y="210" width="52" height="52"
        fill="#C46A3A" transform="rotate(45 210 236)"/>

  <!-- manos / confianza -->
  <path d="M62 205 C90 235 118 258 158 282 C178 294 194 306 210 324"
        fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="square"/>
  <path d="M358 205 C330 235 302 258 262 282 C242 294 226 306 210 324"
        fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="square"/>
  <path d="M62 260 C83 302 118 331 166 345"
        fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="square"/>
  <path d="M358 260 C337 302 302 331 254 345"
        fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="square"/>
</g>

<!-- Wordmark -->
<text x="600" y="590" text-anchor="middle"
      fill="#FFFFFF"
      font-family="Montserrat, Arial, Helvetica, sans-serif"
      font-size="112" font-weight="500"
      letter-spacing="25">KUQUBA</text>

<!-- Separador -->
<line x1="355" y1="660" x2="545" y2="660" stroke="#148575" stroke-width="3"/>
<rect x="592" y="652" width="16" height="16" fill="#C46A3A"
      transform="rotate(45 600 660)"/>
<line x1="655" y1="660" x2="845" y2="660" stroke="#148575" stroke-width="3"/>

<!-- Tagline -->
<text x="600" y="725" text-anchor="middle"
      fill="#15917F"
      font-family="Montserrat, Arial, Helvetica, sans-serif"
      font-size="28" font-weight="500"
      letter-spacing="7">CONEXIONES QUE GENERAN CONFIANZA</text>
</svg>